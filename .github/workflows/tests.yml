name: UI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Prepare demo settings
        run: cp .env.example .env

      - name: Run Playwright tests with pytest and generate Allure results
        run: pytest -m regression --alluredir=allure-results --numprocesses 2

      - name: Save Allure results
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: error
          retention-days: 7

  publish-report:
    needs: run-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Download Allure results
        uses: actions/download-artifact@v8.0.2
        with:
          name: allure-results
          path: allure-results

      - name: Get Allure history
        uses: actions/checkout@v7.0.1
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report with history
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Attributes</title>
  <style>
    .h2-text {
      color: red;
    }
  </style>
</head>
<body>
  <div>
    <h1 id="h1-text">H1 text</h1>
    <h2 class="h2-text">H2 text</h2>
    <h6 class="h2-text">H6 text</h6>

    <p>
      Native mobile emulation of Google Chrome for Android and
      <span style="color: green">Mobile Safari</span>.
    </p>

    <a href="https://playwright.dev/python/" target="_blank">Python</a>

    <img
      alt="browsers.png"
      src="https://playwright.dev/python/img/logos/Browsers.png"
      style="width: 250px"
    >

    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ul>

    <ol>
      <li>Item 1</li>
      <li>Item 2</li>
      <li>Item 3</li>
    </ol>

    <form action="/action" method="POST">
      <input type="text" value="12345" placeholder="Text">
      <input required type="email" placeholder="Email">
      <input type="password" placeholder="Password">
      <textarea required placeholder="Text">12345</textarea>
    </form>
  </div>
</body>
</html>

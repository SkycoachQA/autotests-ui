stages:
  - test
  - report
  - deploy

run-tests:
  stage: test
  image: ubuntu:24.04
  allow_failure: true
  before_script:
    - apt-get update
    - apt-get install -y python3.12 python3.12-venv python3-pip
    - python3.12 -m venv venv
    - . venv/bin/activate
    - pip install -r requirements.txt
    - playwright install --with-deps
    - cp .env.example .env
  script:
    - pytest -m regression --alluredir=allure-results --numprocesses 2
  artifacts:
    paths:
      - allure-results/
    when: always
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

publish-report:
  stage: report
  image: ubuntu:24.04
  needs: [run-tests]
  before_script:
    - apt-get update
    - apt-get install -y openjdk-17-jre-headless wget tar
    - wget https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
    - tar -xzf allure-2.32.0.tgz
  script:
    - allure-2.32.0/bin/allure generate allure-results -o allure-report --clean
  artifacts:
    paths:
      - allure-report/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

pages:
  stage: deploy
  needs: [publish-report]
  script:
    - mkdir -p public
    - cp -r allure-report/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
